name: Offline tests
on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test

      - name: Compile and test native C99 modules
        run: |
          cmake -S native/rgi -B build/rgi -DCMAKE_BUILD_TYPE=Release
          cmake --build build/rgi --parallel
          ctest --test-dir build/rgi --output-on-failure
